<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptLine Marketing — Proposed v2</title>
<meta name="description" content="Proposed upgrade to the PromptLine marketing dashboard. Illustrative sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Design tokens lifted verbatim from admin.sandbox.promptline.app
   (assets/index-ov6Y03eY.css) so this drops into the existing codebase.
   Chart palette added on top, validated for CVD separation + contrast in both
   modes against the real card surfaces.
--------------------------------------------------------------------------- */
:root{
  color-scheme:light;
  --primary:212 100% 47%; --primary-foreground:0 0% 98%;
  --background:210 40% 98%; --foreground:222 47% 11%;
  --card:0 0% 100%; --card-foreground:222 47% 11%;
  --secondary:215 32% 94%; --secondary-foreground:222 47% 11%;
  --muted:214 31% 91%; --muted-foreground:215 19% 35%;
  --accent:216 82% 97%;
  --destructive:0 84% 60%; --success:142 71% 45%; --warning:38 92% 50%;
  --border:214 32% 87%; --input:214 32% 87%; --ring:212 100% 47%;
  --radius:.75rem;
  --sidebar-background:222 47% 11%; --sidebar-foreground:210 40% 98%;
  --sidebar-primary:212 100% 47%; --sidebar-accent:220 36% 16%;
  --sidebar-border:223 47% 11%;
  --font-main:"Montserrat","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --elevation-1:0 8px 24px rgba(15,23,42,.06);
  --elevation-2:0 12px 40px rgba(15,23,42,.10);
  /* chart palette — light mode, validated on #ffffff surface */
  --c1:#1c6fd0; --c2:#0f8f62; --c3:#a86f00; --c4:#6d4ac9;
  --seq1:#cfe0f6; --seq2:#9dc0ed; --seq3:#6b9fe3; --seq4:#3a80da; --seq5:#1c6fd0; --seq6:#12508f; --seq7:#0b3560;
  --grid:rgba(15,23,42,.08); --axis:rgba(15,23,42,.45);
  --surface-chart:#ffffff;
}
html.dark{
  color-scheme:dark;
  --background:224 29% 9%; --foreground:210 40% 98%;
  --card:223 40% 12%; --card-foreground:210 40% 98%;
  --primary:212 100% 50%; --primary-foreground:222 47% 11%;
  --secondary:220 28% 18%; --secondary-foreground:210 40% 98%;
  --muted:220 28% 18%; --muted-foreground:215 20% 70%;
  --accent:219 22% 20%;
  --destructive:0 70% 45%; --success:142 60% 42%; --warning:38 80% 48%;
  --border:219 20% 25%; --input:219 20% 25%; --ring:212 100% 50%;
  --sidebar-background:223 35% 8%; --sidebar-foreground:210 40% 98%;
  --sidebar-primary:212 100% 55%; --sidebar-accent:223 30% 15%;
  --sidebar-border:223 25% 18%;
  --elevation-1:0 8px 24px rgba(0,0,0,.25);
  --elevation-2:0 12px 40px rgba(0,0,0,.35);
  /* chart palette — dark mode, validated on #12192b card surface */
  --c1:#3d8ae8; --c2:#1baf7a; --c3:#bf8200; --c4:#8d6ae0;
  --seq1:#14304f; --seq2:#1a4573; --seq3:#215b97; --seq4:#2872bd; --seq5:#3d8ae8; --seq6:#6da8ee; --seq7:#9cc5f4;
  --grid:rgba(255,255,255,.07); --axis:rgba(255,255,255,.45);
  --surface-chart:#12192b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-main);
  background:hsl(var(--background));
  color:hsl(var(--foreground));
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.muted{color:hsl(var(--muted-foreground))}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sidebar{
  background:hsl(var(--sidebar-background));color:hsl(var(--sidebar-foreground));
  border-right:1px solid hsl(var(--sidebar-border));
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:.6rem;padding:1.1rem 1.25rem;border-bottom:1px solid hsl(var(--sidebar-border))}
.brand-mark{width:28px;height:28px;border-radius:8px;background:hsl(var(--sidebar-primary));display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;flex:none}
.brand b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;opacity:.6}
.navgroup{padding:.9rem 0 .2rem}
.navgroup>p{font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.45;padding:0 1.25rem .45rem;font-weight:600}
.navlink{display:flex;align-items:center;gap:.65rem;width:100%;text-align:left;padding:.55rem 1.25rem;font-size:13.5px;font-weight:500;opacity:.78;border-left:2px solid transparent}
.navlink:hover{opacity:1;background:hsl(var(--sidebar-accent))}
.navlink.on{opacity:1;background:hsl(var(--sidebar-accent));border-left-color:hsl(var(--sidebar-primary));font-weight:600}
.navlink .ic{width:16px;height:16px;flex:none;opacity:.85}
.navbadge{margin-left:auto;font-size:10px;font-weight:700;padding:.1rem .35rem;border-radius:5px;background:hsl(var(--sidebar-primary));color:#fff}
.sidefoot{margin-top:auto;padding:1rem 1.25rem;font-size:11px;opacity:.5;border-top:1px solid hsl(var(--sidebar-border))}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:.6rem;padding:.7rem 1.5rem;
  border-bottom:1px solid hsl(var(--border));background:hsl(var(--card));
  position:sticky;top:0;z-index:30;
}
.topbar .grow{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:.4rem;padding:.38rem .7rem;border-radius:8px;
  border:1px solid hsl(var(--border));background:hsl(var(--secondary));font-size:12.5px;font-weight:600;
}
.avatar{width:30px;height:30px;border-radius:50%;background:hsl(var(--primary));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.whoami{line-height:1.15;text-align:right}
.whoami b{font-size:12.5px}.whoami span{font-size:10.5px;display:block}

.page{padding:1.5rem;max-width:1560px;width:100%;margin-inline:auto}
.pagehead{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.pagehead h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.pagehead p{font-size:13px;margin-top:.15rem}
.pagehead .acts{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .85rem;border-radius:9px;font-size:13px;font-weight:600;border:1px solid hsl(var(--border));background:hsl(var(--secondary))}
.btn:hover{border-color:hsl(var(--primary)/.5)}
.btn--primary{background:hsl(var(--primary));color:#fff;border-color:hsl(var(--primary))}
.btn--sm{padding:.32rem .6rem;font-size:12px}

/* ---------- filter bar ---------- */
.filters{
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  padding:.65rem .8rem;border:1px solid hsl(var(--border));border-radius:var(--radius);
  background:hsl(var(--card));margin-bottom:1.1rem;box-shadow:var(--elevation-1);
}
.seg{display:inline-flex;background:hsl(var(--secondary));border-radius:8px;padding:2px;border:1px solid hsl(var(--border))}
.seg button{padding:.3rem .55rem;border-radius:6px;font-size:12px;font-weight:600;color:hsl(var(--muted-foreground))}
.seg button.on{background:hsl(var(--card));color:hsl(var(--foreground));box-shadow:var(--elevation-1)}
select.f,input.f{
  padding:.42rem .6rem;border-radius:8px;border:1px solid hsl(var(--input));
  background:hsl(var(--card));color:hsl(var(--foreground));font-size:12.5px;font-weight:500;font-family:inherit;
}
.fsep{width:1px;align-self:stretch;background:hsl(var(--border));margin:0 .15rem}
.fchips{display:flex;gap:.35rem;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:.35rem;font-size:11.5px;font-weight:600;padding:.25rem .5rem;border-radius:999px;background:hsl(var(--primary)/.12);color:hsl(var(--primary));border:1px solid hsl(var(--primary)/.25)}
.fchip button{font-size:13px;line-height:1;opacity:.7}

/* ---------- cards / grid ---------- */
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);box-shadow:var(--elevation-1)}
.card>header{padding:.9rem 1.1rem .1rem;display:flex;align-items:flex-start;gap:.75rem;flex-wrap:wrap}
.card>header h3{font-size:14px;font-weight:700}
.card>header p{font-size:11.5px;margin-top:.1rem}
.card>header .r{margin-left:auto;display:flex;gap:.4rem;align-items:center}
.card .body{padding:1.1rem}
.grid{display:grid;gap:1rem}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}

/* ---------- stat tiles ---------- */
.stat{padding:.95rem 1.1rem}
.stat .lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:hsl(var(--muted-foreground));display:flex;align-items:center;gap:.3rem}
.stat .val{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;margin:.25rem 0 .1rem;font-variant-numeric:tabular-nums}
.stat .sub{font-size:11.5px;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums}
.delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:.2rem}
.up{color:hsl(var(--success))}.down{color:hsl(var(--destructive))}.flat{color:hsl(var(--muted-foreground))}
.spark{display:block;margin-top:.4rem}
.info{
  width:13px;height:13px;border-radius:50%;border:1px solid hsl(var(--muted-foreground));
  display:inline-grid;place-items:center;font-size:8.5px;font-weight:700;opacity:.65;cursor:help;flex:none;
}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;
  color:hsl(var(--muted-foreground));padding:.5rem .7rem;border-bottom:1px solid hsl(var(--border));white-space:nowrap;
}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td{padding:.6rem .7rem;border-bottom:1px solid hsl(var(--border));vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:hsl(var(--accent)/.5)}
.rowlink{font-weight:600;color:hsl(var(--primary));cursor:pointer;text-align:left}
.rowlink:hover{text-decoration:underline}
.sub2{font-size:11px;color:hsl(var(--muted-foreground))}

.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:11px;font-weight:600;padding:.13rem .45rem;border-radius:6px;background:hsl(var(--secondary));border:1px solid hsl(var(--border));white-space:nowrap}
.tag.ind{background:hsl(var(--primary)/.12);border-color:hsl(var(--primary)/.3);color:hsl(var(--primary))}
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:11px;font-weight:700;padding:.15rem .5rem;border-radius:999px;white-space:nowrap}
.pill-ok{background:hsl(var(--success)/.15);color:hsl(var(--success))}
.pill-warn{background:hsl(var(--warning)/.16);color:hsl(var(--warning))}
.pill-bad{background:hsl(var(--destructive)/.16);color:hsl(var(--destructive))}
.pill-mut{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- bars in tables ---------- */
.minibar{height:5px;border-radius:3px;background:hsl(var(--muted));overflow:hidden;min-width:56px}
.minibar i{display:block;height:100%;border-radius:3px}

/* ---------- legend ---------- */
.legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:hsl(var(--muted-foreground))}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* ---------- small multiples ---------- */
.sm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}
.sm-panel{min-width:0}
.sm-panel figcaption{display:flex;align-items:center;gap:.35rem;font-size:11.5px;font-weight:600;color:hsl(var(--muted-foreground));margin-bottom:.2rem}
.sm-panel figcaption b{margin-left:auto;font-size:13px;color:hsl(var(--foreground));font-variant-numeric:tabular-nums}
.sm-dot{width:9px;height:9px;border-radius:3px;flex:none}
.sm-plot{min-height:118px}
@media (max-width:1180px){.sm-grid{grid-template-columns:1fr}}

/* ---------- funnel ---------- */
.funnel{display:flex;flex-direction:column;gap:.45rem}
.fstep{display:grid;grid-template-columns:132px 1fr 150px;gap:.7rem;align-items:center}
.fstep .fname{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:.4rem}
.ftrack{background:hsl(var(--muted)/.55);border-radius:7px;height:30px;overflow:hidden;position:relative}
.ftrack i{display:block;height:100%;border-radius:7px;position:relative;transition:width .5s cubic-bezier(.4,0,.2,1)}
.ftrack b{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.fmeta{font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;color:hsl(var(--muted-foreground))}
.fmeta b{display:block;font-size:12.5px;color:hsl(var(--foreground))}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:1.4rem}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:hsl(var(--border))}
.tlrow{position:relative;padding:0 0 1rem}
.tlrow:last-child{padding-bottom:0}
.tldot{position:absolute;left:-1.4rem;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid hsl(var(--card));box-shadow:0 0 0 1px hsl(var(--border))}
.tlrow h4{font-size:13px;font-weight:600}
.tlrow p{font-size:11.5px;color:hsl(var(--muted-foreground));margin-top:.1rem}
.tlrow time{font-size:11px;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums}

/* ---------- misc ---------- */
.notice{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem 1rem;border-radius:var(--radius);font-size:12.5px;line-height:1.45}
.notice-warn{background:hsl(var(--warning)/.1);border:1px solid hsl(var(--warning)/.3)}
.notice-info{background:hsl(var(--primary)/.08);border:1px solid hsl(var(--primary)/.22)}
.notice b{display:block;font-size:13px;margin-bottom:.1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;font-size:12.5px}
.kv dt{color:hsl(var(--muted-foreground));font-weight:600}
.kv dd{font-variant-numeric:tabular-nums;text-align:right}
.sectionlead{font-size:12.5px;color:hsl(var(--muted-foreground));margin-bottom:.8rem;max-width:74ch}
.hr{height:1px;background:hsl(var(--border));margin:1rem 0}
.banner{
  display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
  background:hsl(var(--primary)/.1);border:1px solid hsl(var(--primary)/.28);
  border-radius:var(--radius);padding:.6rem .9rem;font-size:12px;font-weight:600;margin-bottom:1rem;
}
.banner .pill{background:hsl(var(--primary));color:#fff}

/* tooltip */
#tip{
  position:fixed;pointer-events:none;z-index:99;opacity:0;transition:opacity .12s;
  background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:9px;
  box-shadow:var(--elevation-2);padding:.5rem .65rem;font-size:12px;min-width:132px;
}
#tip h5{font-size:11.5px;font-weight:700;margin-bottom:.3rem}
#tip .tr{display:flex;align-items:center;gap:.4rem;font-variant-numeric:tabular-nums}
#tip .tr i{width:8px;height:8px;border-radius:2px;flex:none}
#tip .tr span{margin-left:auto;font-weight:700}

.viewhide{display:none}
.scrollx{overflow-x:auto}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:span 2}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center;gap:.2rem;padding:0 .5rem}
  .brand{border-bottom:none;border-right:1px solid hsl(var(--sidebar-border));padding:.7rem .8rem;flex:none}
  .brand .txt{display:none}
  .navgroup{display:flex;align-items:center;padding:0}
  .navgroup>p{display:none}
  .navlink{padding:.75rem .7rem;white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
  .navlink.on{border-left:none;border-bottom-color:hsl(var(--sidebar-primary));background:transparent}
  .sidefoot{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:span 1}
  .page{padding:1rem}
  .fstep{grid-template-columns:110px 1fr}
  .fstep .fmeta{grid-column:1/-1;text-align:left;display:flex;gap:.6rem}
  .fstep .fmeta b{display:inline}
}
@media (max-width:640px){
  .g4{grid-template-columns:1fr}
}
@media (max-width:560px){
  .page{padding:.85rem}
  .pagehead h1{font-size:1.25rem}
  .stat .val{font-size:1.5rem}
  .topbar{padding:.6rem .85rem}
  .whoami{display:none}
  .filters{padding:.55rem}
}
@media (max-width:400px){
  .fstep{grid-template-columns:92px 1fr}
  .seg button{padding:.3rem .42rem;font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="tip" role="tooltip"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="txt"><b>PromptLine</b><span>Marketing</span></div>
    </div>
    <nav class="navgroup">
      <p>Overview</p>
      <button class="navlink on" data-view="dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Dashboard</button>
      <button class="navlink" data-view="attribution"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v4H3zM6 10h12v4H6zM9 17h6v4H9z"/></svg>Attribution</button>
    </nav>
    <nav class="navgroup">
      <p>Campaigns</p>
      <button class="navlink" data-view="campaigns"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>Campaigns</button>
      <button class="navlink" data-view="sequences"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M6.5 10v4a3 3 0 003 3h4.5"/></svg>Sequences</button>
      <button class="navlink" data-view="templates"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></svg>Templates</button>
    </nav>
    <nav class="navgroup">
      <p>Audience</p>
      <button class="navlink" data-view="contacts"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/></svg>Contacts</button>
      <button class="navlink" data-view="segments"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>Tags &amp; Segments</button>
    </nav>
    <nav class="navgroup">
      <p>Settings</p>
      <button class="navlink" data-view="deliverability"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Deliverability<span class="navbadge" id="delivBadge">2</span></button>
      <button class="navlink" data-view="senders"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>Senders</button>
    </nav>
    <div class="sidefoot">Proposed v2 · prototype<br>Illustrative sample data</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
        Marketing
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
      </span>

function sparkline(vals, color, w, h) {

  var pts = vals.map(function (v, i) {
    return (i / (vals.length - 1) * w).toFixed(1) + "," + (h - 2 - (v - mn) / rg * (h - 4)).toFixed(1);
  }).join(" ");
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
    '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + color +

      '<div class="sm-plot" data-p="' + i + '"></div></figure>';
  }).join("") + '</div>';
  cfg.panels.forEach(function (p, i) {

/* -- line chart, crosshair + tooltip ------------------------------------- */
function lineChart(el, cfg) {
  var W = el.clientWidth || 640, H = cfg.height || 240;
  var m = cfg.compact ? { t: 10, r: 10, b: 20, l: 34 } : { t: 14, r: 16, b: 26, l: 40 };
  var iw = W - m.l - m.r, ih = H - m.t - m.b;
  var all = cfg.series.reduce(function (a, s) { return a.concat(s.values); }, []);
  var mx = Math.max.apply(null, all) * 1.15, mn = 0;
  var dp = mx < 3 ? 1 : 0;
  var X = function (i) { return m.l + i / (cfg.labels.length - 1) * iw; };
  var Y = function (v) { return m.t + ih - (v - mn) / (mx - mn) * ih; };

  var s = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.aria) + '">';
  var ticks = cfg.compact ? 2 : 4;
  for (var g = 0; g <= ticks; g++) {
    var v = mn + (mx - mn) * g / ticks, y = Y(v);
    s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) +
         '" stroke="' + cssv("--grid") + '" stroke-width="1"/>';
    s += '<text x="' + (m.l - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="' +
         cssv("--axis") + '" font-family="Montserrat,sans-serif">' + v.toFixed(dp) + '%</text>';
  }
  var every = Math.ceil(cfg.labels.length / (cfg.compact ? 3 : 7));
  cfg.labels.forEach(function (lab, i) {
    if (i % every !== 0 && i !== cfg.labels.length - 1) return;
    if (cfg.compact && i !== 0 && i !== cfg.labels.length - 1) return;
    s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' +
         (cfg.compact ? (i === 0 ? "start" : "end") : "middle") + '" font-size="9.5" fill="' +
         cssv("--axis") + '" font-family="Montserrat,sans-serif">' + esc(lab) + '</text>';
  });
  cfg.series.forEach(function (ser) {
    var d = ser.values.map(function (v, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); }).join(" ");
    s += '<path d="' + d + '" fill="none" stroke="' + ser.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    // direct label on the final point — identity never rests on colour alone
    var lx = X(ser.values.length - 1), ly = Y(ser.values[ser.values.length - 1]);
    s += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="3.5" fill="' + ser.color +
         '" stroke="' + cssv("--surface-chart") + '" stroke-width="2"/>';
  });
  s += '<line id="cx" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="' + cssv("--axis") +
       '" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
  s += '<rect x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="transparent" id="hit"/></svg>';
  el.innerHTML = s;

  var svg = el.querySelector("svg"), cx = el.querySelector("#cx"), hit = el.querySelector("#hit");
  function move(ev) {
    var r = svg.getBoundingClientRect();
    var px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    var sx = px / r.width * W;
    var i = Math.round((sx - m.l) / iw * (cfg.labels.length - 1));
    i = Math.max(0, Math.min(cfg.labels.length - 1, i));
    cx.setAttribute("x1", X(i)); cx.setAttribute("x2", X(i)); cx.setAttribute("opacity", "1");
    var h = "<h5>" + esc(cfg.labels[i]) + "</h5>";
    cfg.series.forEach(function (ser) {
      h += '<div class="tr"><i style="background:' + ser.color + '"></i>' + esc(ser.name) +
           "<span>" + ser.values[i].toFixed(2) + "%</span></div>";
    });
    showTip(h, ev.touches ? ev.touches[0].clientX : ev.clientX, r.top + m.t + 40);
  }
  hit.addEventListener("mousemove", move);
  hit.addEventListener("touchmove", move, { passive:true });
  hit.addEventListener("mouseleave", function () { cx.setAttribute("opacity", "0"); hideTip(); });
}

  }).join("") + '</div>' + (opts && opts.note ? '<p class="sub2" style="margin-top:.7rem">' + esc(opts.note) + '</p>' : "");
}

function statTile(o) {
  return '<div class="card stat">' +
    '<div class="lbl">' + esc(o.label) + (o.info ? '<span class="info" title="' + esc(o.info) + '">i</span>' : "") + '</div>' +
    '<div class="val">' + o.value + '</div>' +
    '<div class="sub">' + (o.delta !== undefined
      ? '<span class="delta ' + (o.delta > 0 ? "up" : o.delta < 0 ? "down" : "flat") + '">' +
        (o.delta > 0 ? "▲" : o.delta < 0 ? "▼" : "■") + " " + Math.abs(o.delta).toFixed(1) + (o.deltaUnit || "pp") + '</span> ' : "") +
      esc(o.sub || "") + '</div>' +
    (o.spark ? sparkline(o.spark, o.sparkColor || cssv("--c1")) : "") +
    '</div>';
}

function engPill(e) {
  var m = { Hot:"pill-ok", Warm:"pill-warn", Cold:"pill-mut", Suppressed:"pill-bad", Customer:"pill-ok" };
  return '<span class="pill ' + m[e] + '">' + esc(e) + '</span>';
}

  var h = '<div class="filters">' +

  }
  if (opts.search) h += '<input class="f" id="fQ" placeholder="Search name, email, company…" style="min-width:210px;flex:1">';
  h += '<span class="grow" style="flex:1"></span><button class="btn btn--sm" id="saveView">Save this view</button>' +
       '<button class="btn btn--sm">Export CSV</button></div>';

        return '<span class="fchip">' + esc(c) + '<button data-clear="' + esc(c) + '">&times;</button></span>';

    }
  }
  return h;
}

      '<p class="muted">First touch and last touch, side by side. They disagree, and the disagreement is the useful part.</p></div></header>' +
      '<div class="tblwrap"><table><thead><tr><th>Campaign</th><th class="n">Clicks</th><th class="n">Leads (last touch)</th>' +
      '<th class="n">Leads (first touch)</th><th class="n">Click → lead</th><th class="n">Demos</th><th class="n">Customers</th><th class="n">MRR</th></tr></thead><tbody>' +
      CAMPAIGNS.map(function (c, i) {
        var ft = Math.max(0, c.leads + [6, -3, -4, 2, 5, -6][i]);
        return '<tr><td>' + esc(c.name) + '</td><td class="n">' + n(c.clicks) + '</td>' +
          '<td class="n"><b>' + n(c.leads) + '</b></td><td class="n">' + n(ft) + '</td>' +
          '<td class="n">' + pc(rate(c.leads, c.clicks), 1) + '</td><td class="n">' + n(c.demos) + '</td>' +
          '<td class="n">' + n(c.customers) + '</td><td class="n">$' + n(c.customers * 99) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<div class="body" style="padding-top:.7rem"><p class="sub2">The evergreen calculator follow-up looks weak on last touch (9 leads) and much stronger on first touch — it is the email that starts the relationship, then an industry sequence closes it. Judged on last touch alone it would have been switched off.</p></div></div>' +
    '<div class="grid g2">' +
      '<div class="card"><header><div><h3>How a lead is attributed</h3></div></header><div class="body">' +
        '<p class="sectionlead">Every link in every send is rewritten with a click id. The click id is set as a first-party cookie on the landing page and posted with the calculator or contact form. When a form arrives with a click id, the lead is joined to the exact send, step, campaign and contact.</p>' +
        '<p class="sectionlead">When the cookie is missing — a different device, a blocked cookie — the fallback is an email match against contacts that clicked in the previous 30 days. Matches found that way are labelled <em>inferred</em> in the table rather than quietly counted as certain.</p>' +
      '</div></div>' +
      '<div class="card"><header><div><h3>Revenue join</h3></div></header><div class="body">' +
        '<p class="sectionlead">The marketing tables and the product tables live in the same database. A new tenant whose billing email matches an attributed contact closes the loop from a click to paid MRR without an external analytics tool, and without exporting customer data anywhere.</p>' +
        '<p class="sectionlead">This is the one thing a white-label dashboard can do that Kit and Resend structurally cannot — they never see the product database. It is the reason to build this rather than buy it.</p>' +
      '</div></div>' +
    '</div>';
};

/* ----------------------------- router -----------------------------------
   One delegated listener per event type, bound once. Binding inside each view
   would stack a new handler on #page at every render, and stale handlers from
   earlier views then fire on the same click.                                 */
var current = "dashboard", currentArg;
function go(view, arg) {
  current = view; currentArg = arg;
  window.scrollTo({ top:0, behavior:"instant" });
  (VIEWS[view] || VIEWS.dashboard)(arg);
  var map = { campaignDetail:"campaigns", contactDetail:"contacts" };
  var active = map[view] || view;
  Array.prototype.forEach.call(document.querySelectorAll(".navlink"), function (b) {
    b.classList.toggle("on", b.dataset.view === active);
  });
}
function rerender(keepFocus) { (VIEWS[current] || VIEWS.dashboard)(keepFocus ? true : currentArg); }

page.addEventListener("click", function (e) {
  var t;
  if ((t = e.target.closest("[data-camp]")))    return go("campaignDetail", t.dataset.camp);
  if ((t = e.target.closest("[data-contact]"))) return go("contactDetail", t.dataset.contact);
  if ((t = e.target.closest("[data-back]")))    return go(t.dataset.back);
  if ((t = e.target.closest("#rangeSeg button[data-r]"))) { STATE.range = t.dataset.r; return rerender(); }
  if ((t = e.target.closest("[data-clear]"))) {
    var c = t.dataset.clear;
    if (c.indexOf("Industry") === 0) STATE.industry = "all";
    if (c.indexOf("Engagement") === 0) STATE.eng = "all";
    return rerender();
  }
});
page.addEventListener("change", function (e) {
  if (e.target.id === "fInd") { STATE.industry = e.target.value; rerender(); }
  if (e.target.id === "fEng") { STATE.eng = e.target.value; rerender(); }
});
page.addEventListener("input", function (e) {
  if (e.target.id === "fQ") { STATE.q = e.target.value; rerender(true); }
});

document.querySelectorAll(".navlink").forEach(function (b) {
  b.addEventListener("click", function () { go(b.dataset.view); });
});
document.getElementById("themeBtn").addEventListener("click", function () {
  document.documentElement.classList.toggle("dark");
  rerender();
});
var ro;
window.addEventListener("resize", function () { clearTimeout(ro); ro = setTimeout(function () { rerender(); }, 220); });

go("dashboard");
})();

</script>
</body>
</html>
